<div class="editor-heading">
  <h2 mat-dialog-title>{{ data.title ? 'Edit note' : 'New note' }}</h2>
  <button mat-icon-button mat-dialog-close aria-label="Close editor">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="editor-content">
  <div class="editor-type-switch" role="group" aria-label="Note type">
    <button mat-button type="button" [class.type-active]="type === 'text'" (click)="type = 'text'">
      <mat-icon>notes</mat-icon> Text
    </button>
    <button mat-button type="button" [class.type-active]="type === 'checklist'" (click)="type = 'checklist'">
      <mat-icon>checklist</mat-icon> Checklist
    </button>
  </div>

  <input matInput class="editor-title" [(ngModel)]="title" name="title" maxlength="120" placeholder="Title" aria-label="Note title">

  <textarea *ngIf="type === 'text'" matInput class="editor-body" [(ngModel)]="content" name="content" rows="10" placeholder="Take a note..." aria-label="Note content"></textarea>

  <div class="editor-checklist" *ngIf="type === 'checklist'">
    <div class="editor-checklist-row" *ngFor="let item of checklistItems; let i = index">
      <mat-checkbox [(ngModel)]="item.checked" [name]="'item-check-' + i" color="primary" aria-label="Mark checklist item complete"></mat-checkbox>
      <input matInput [(ngModel)]="item.text" [name]="'item-text-' + i" [class.item-checked]="item.checked" placeholder="List item">
      <button mat-icon-button type="button" (click)="removeChecklistItem(item.id)" matTooltip="Remove item" aria-label="Remove checklist item">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <button mat-button type="button" class="add-checklist-item" (click)="addChecklistItem()">
      <mat-icon>add</mat-icon> Add item
    </button>
  </div>

  <mat-form-field appearance="outline" class="tags-field">
    <mat-label>Labels</mat-label>
    <input matInput [(ngModel)]="tagsText" name="tags" placeholder="Work, Ideas, Personal">
    <mat-hint>Separate labels with commas.</mat-hint>
  </mat-form-field>

  <div class="color-section">
    <span class="color-label">Note color</span>
    <div class="color-options">
      <button
        *ngFor="let option of colorOptions"
        mat-icon-button
        class="color-option"
        [class.color-selected]="color === option.value"
        [style.background-color]="option.value"
        [attr.aria-label]="option.label + ' note color'"
        [matTooltip]="option.label"
        (click)="color = option.value">
        <mat-icon *ngIf="color === option.value">check</mat-icon>
      </button>
    </div>
  </div>

  <div class="editor-options">
    <mat-checkbox [(ngModel)]="pinned" name="pinned" color="primary">Pin note</mat-checkbox>
    <mat-checkbox [(ngModel)]="favorite" name="favorite" color="primary">Add to favorites</mat-checkbox>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="!title.trim() && !content.trim() && !hasChecklistText()">Save</button>
</mat-dialog-actions>
